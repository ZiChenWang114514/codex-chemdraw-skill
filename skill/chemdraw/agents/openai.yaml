interface:
  display_name: "ChemDraw"
  short_description: "Resolve, compare, edit, render, analyze, and embed chemistry"
  default_prompt: "Use $chemdraw to complete this chemistry workflow with grounded structures, preserved sources, and native ChemDraw verification."

dependencies:
  tools:
    - type: "mcp"
      value: "cdxml-toolkit"
      description: "Local cdxml-toolkit chemistry and ChemDraw automation server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true

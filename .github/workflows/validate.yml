name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate installer dry run
        shell: pwsh
        run: ./scripts/install.ps1

  full-portable-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned toolkit runtime
        run: python -m pip install "mcp==2.0.0" "cdxml-toolkit==0.5.17"

      - name: Run complete portable Skill tests
        run: python -m unittest discover -s skill/chemdraw/scripts -p "test_*.py"

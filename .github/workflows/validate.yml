name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate installer dry run
        shell: pwsh
        run: ./scripts/install.ps1
